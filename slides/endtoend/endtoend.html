<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>End-to-End Example</title>

    <link rel="icon" href="../../img/zuehlke_logo.jpg">
    <link rel="stylesheet" href="../../dist/reveal.css">
    <link rel="stylesheet" href="../../css/theme/zuehlke.css">

    <!-- Theme used for syntax highlighting of code -->
    <link rel="stylesheet" href="../../plugin/highlight/monokai.css">
</head>
<body>
<div class="reveal">
    <div class="slides">
        <section class="deck-slide">
            <h1>Kotlin Spring Boot</h1>
        </section>
        <section data-external="topic/springbootexercises.html" class="deck-slide"></section>
        <section data-external="topic/testlibraries.html" class="deck-slide"></section>
        <section data-external="topic/jpa.html" class="deck-slide"></section>
        <section data-external="topic/lambdafordsl.html" class="deck-slide"></section>
    </div>
</div>

<script src="../../dist/reveal.js"></script>
<script src="../../plugin/highlight/highlight.js"></script>
<script src="../../plugin/zoom/zoom.js"></script>
<script src="../../plugin/notes/notes.js"></script>
<script src="../../plugin/search/search.js"></script>
<script src="../../plugin/markdown/markdown.js"></script>
<script>
  Reveal.initialize({
    plugins: [RevealNotes, RevealHighlight, RevealZoom, RevealMarkdown],
    dependencies: [
        {
            src: '../../plugin/external/external.js', 
            condition: function() { 
                return !!document.querySelector( '[data-external],[data-external-replace]' ); 
            }
        }
    ]
  });
</script>
</body>
</html>
